<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J3P Leadership Advisory Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f5f5f7;
      color: #1d1d1f;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1d1d1f;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header button {
      background: transparent;
      color: white;
      border: 1px solid #555;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    header button:hover { background: #333; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .msg {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { background: #007aff; color: white; margin-left: 15%; }
    .assistant { background: white; border: 1px solid #e0e0e0; margin-right: 15%; }
    .typing { color: #888; font-style: italic; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      background: white;
      border-top: 1px solid #e0e0e0;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #007aff; }
    button[type="submit"] {
      padding: 0.75rem 1.5rem;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
    }
    button[type="submit"]:disabled { background: #999; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>J3P Leadership Advisory Assistant</h1>
    <button id="reset-btn">New conversation</button>
  </header>
  <div id="chat">
    <div class="msg assistant">{{ opening }}</div>
  </div>
  <form id="chat-form">
    <input type="text" id="message" placeholder="Type your message..." autocomplete="off" autofocus required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      const thinking = addMessage("Thinking...", "assistant typing");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        thinking.remove();
        if (data.reply) {
          addMessage(data.reply, "assistant");
        } else {
          addMessage("Error: " + (data.error || "Unknown error"), "assistant");
        }
      } catch (err) {
        thinking.remove();
        addMessage("Network error: " + err.message, "assistant");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    resetBtn.addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      chat.innerHTML = '<div class="msg assistant">{{ opening }}</div>';
      input.focus();
    });
  </script>
</body>
</html>
